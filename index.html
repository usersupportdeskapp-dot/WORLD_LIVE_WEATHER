<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Live Weather</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#087f8c,#339af0);min-height:100vh;padding:28px;color:#102a43}
.wrap{max-width:1050px;margin:auto}.head{text-align:center;color:#fff}.head h1{font-size:38px;margin:0 0 8px}.panel{background:#ffffffee;border-radius:24px;padding:24px;margin-top:20px;box-shadow:0 18px 50px #0003}
.search{display:flex;gap:10px}.search input{flex:1;padding:15px;border:1px solid #ccd5df;border-radius:13px;font-size:17px}.search button{padding:0 24px;border:0;border-radius:13px;background:#087f8c;color:#fff;font-weight:bold}
.results{display:grid;gap:8px;margin-top:12px}.result{padding:12px;background:#f1f6f9;border-radius:12px;cursor:pointer}.status{text-align:center;padding:15px;color:#64748b}
.weather{display:none;margin-top:20px}.hero{display:flex;justify-content:space-between;align-items:center;padding:24px;border-radius:20px;background:#eef8ff}.place{font-size:27px;font-weight:800}.temp{font-size:62px;font-weight:800}.sub{color:#607080;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.card{background:#f5f7fa;border-radius:16px;padding:17px;text-align:center}.label{font-size:13px;color:#667085}.value{font-size:20px;font-weight:700;margin-top:7px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#f5f7fa;border-radius:14px;padding:12px;text-align:center;margin-top:8px}.day small{display:block;color:#667085;margin:5px 0}.footer{text-align:center;color:#fff;margin-top:15px;font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.days{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column;text-align:center;gap:10px}}@media(max-width:480px){.search{flex-direction:column}.search button{padding:13px}.head h1{font-size:30px}}
</style></head><body><div class="wrap"><div class="head"><h1>🌍 World Live Weather</h1><p>Search any city or place around the world</p></div>
<div class="panel"><div class="search"><input id="q" placeholder="Lahore, Dubai, London, New York, Tokyo..."><button onclick="search()">Search</button></div>
<div id="results" class="results"></div><div id="status" class="status">Search for a city to begin.</div>
<div id="weather" class="weather"><div class="hero"><div><div id="place" class="place">--</div><div id="condition" class="sub">--</div></div><div id="temp" class="temp">--°C</div></div>
<div class="grid"><div class="card"><div class="label">💧 Humidity</div><div id="humidity" class="value">--</div></div>
<div class="card"><div class="label">🌡️ Feels Like</div><div id="feels" class="value">--</div></div><div class="card"><div class="label">💨 Wind</div><div id="wind" class="value">--</div></div>
<div class="card"><div class="label">☁️ Clouds</div><div id="cloud" class="value">--</div></div><div class="card"><div class="label">🌧️ Rain</div><div id="rain" class="value">--</div></div>
<div class="card"><div class="label">💨 Gusts</div><div id="gust" class="value">--</div></div><div class="card"><div class="label">🧭 Direction</div><div id="dir" class="value">--</div></div>
<div class="card"><div class="label">🕐 Local Time</div><div id="time" class="value">--</div></div></div><h2>7-Day Forecast</h2><div id="days" class="days"></div></div></div>
<div class="footer">Live weather • Auto refresh every 5 minutes • FastAPI + Open-Meteo</div></div>
<script>
const q=document.getElementById("q"),results=document.getElementById("results"),statusEl=document.getElementById("status"),weather=document.getElementById("weather");let selected=null;
q.addEventListener("keydown",e=>{if(e.key==="Enter")search()});
async function search(){let s=q.value.trim();if(s.length<2)return;statusEl.style.display="block";statusEl.textContent="Searching worldwide...";weather.style.display="none";results.innerHTML="";
try{let r=await fetch("/api/search?q="+encodeURIComponent(s)),d=await r.json();statusEl.textContent=d.results.length?"Select a location:":"No location found.";
d.results.forEach(x=>{let e=document.createElement("div");e.className="result";e.textContent=x.name+", "+x.country+(x.admin1?" • "+x.admin1:"");e.onclick=()=>load(x);results.appendChild(e)})}catch(e){statusEl.textContent="Search failed."}}
async function load(x){selected=x;results.innerHTML="";statusEl.textContent="Loading live weather...";
try{let u=`/api/weather?latitude=${x.latitude}&longitude=${x.longitude}&name=${encodeURIComponent(x.name)}&country=${encodeURIComponent(x.country||"")}`,r=await fetch(u),d=await r.json(),c=d.current;
document.getElementById("place").textContent=x.name+", "+x.country;document.getElementById("condition").textContent=icon(c.weather_code)+" "+c.condition;
document.getElementById("temp").textContent=c.temperature+"°C";humidity.textContent=c.humidity+"%";feels.textContent=c.feels_like+"°C";wind.textContent=c.wind_speed+" km/h";cloud.textContent=c.cloud_cover+"%";rain.textContent=c.precipitation+" mm";gust.textContent=c.wind_gusts+" km/h";dir.textContent=c.wind_direction+"°";time.textContent=c.time.replace("T"," ");
let days=document.getElementById("days");days.innerHTML="";d.daily.time.forEach((date,i)=>{let e=document.createElement("div");e.className="day";e.innerHTML=`<b>${new Date(date).toLocaleDateString(undefined,{weekday:"short"})}</b><small>${icon(d.daily.weather_code[i])}</small><b>${d.daily.temperature_2m_max[i]}° / ${d.daily.temperature_2m_min[i]}°</b><small>🌧️ ${d.daily.precipitation_probability_max?.[i]??"--"}%</small>`;days.appendChild(e)});
statusEl.style.display="none";weather.style.display="block"}catch(e){statusEl.textContent="Weather data could not be loaded."}}
function icon(c){if(c===0)return"☀️";if([1,2,3].includes(c))return"⛅";if([45,48].includes(c))return"🌫️";if([51,53,55,56,57].includes(c))return"🌦️";if([61,63,65,66,67,80,81,82].includes(c))return"🌧️";if([71,73,75,77,85,86].includes(c))return"❄️";if([95,96,99].includes(c))return"⛈️";return"🌤️"}
setInterval(()=>{if(selected)load(selected)},300000);
</script></body></html>
